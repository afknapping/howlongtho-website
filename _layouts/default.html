<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}How Long Tho</title>
<meta name="description" content="{{ page.description | default: page.excerpt }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}How Long Tho">
<meta property="og:description" content="{{ page.og_description | default: page.description | default: page.excerpt }}">
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:url" content="https://howlongtho.com{{ page.url }}">
<link rel="canonical" href="https://howlongtho.com{{ page.url }}">
<link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
{% include nav.html %}
<main>
{{ content }}
</main>
<footer>
{% if page.url == "/" %}<a href="/privacy/">Privacy Policy</a>{% else %}<a href="/">Home</a>{% endif %} &middot; <a href="mailto:hello@howlongtho.com">hello@howlongtho.com</a>
</footer>
{% if page.extra_scripts %}{% for s in page.extra_scripts %}<script src="{{ s }}"></script>
{% endfor %}{% endif %}
</body>
</html>
